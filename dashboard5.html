<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard 5: Green Space Intervention Simulator</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --morandi-bg: #F5F7F0;
            --morandi-card: #FFFFFF;
            --morandi-green-1: #E8F5E9;
            --morandi-green-2: #C8E6C9;
            --morandi-green-3: #A5D6A7;
            --morandi-green-4: #81C784;
            --morandi-green-5: #66BB6A;
            --morandi-green-6: #4CAF50;
            --morandi-green-7: #43A047;
            --morandi-green-dark: #2E7D32;
            --morandi-text: #2C3E2D;
            --morandi-text-light: #5A6B5C;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", sans-serif;
            background: var(--morandi-bg);
            color: var(--morandi-text);
        }

        .header-container {
            background-color: #333;
            text-align: center;
            margin-bottom: 0;
        }

        .header-container h1 {
            color: white;
            margin: 0;
            font-size: 40px;
            padding: 27px 0;
        }

        .header-container nav {
            display: flex;
            justify-content: center;
        }

        .header-container nav a {
            display: block;
            color: #f2f2f2;
            text-align: center;
            padding: 12px 20px;
            text-decoration: none;
            border: 1px solid #ccc;
            margin: 0 5px;
            border-radius: 5px;
            background-color: #555;
            transition: 0.3s;
        }

        .header-container nav a:hover {
            background-color: #ddd;
            color: black;
        }

        .header-container nav a.active {
            background-color: #04AA6D;
            color: white;
        }

        .main-container {
            display: flex;
            height: calc(100vh - 120px);
            gap: 20px;
            padding: 0 20px 20px 20px;
        }

        .left-panel {
            flex: 0 0 70%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 0;
        }

        .map-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--morandi-card);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            min-height: 0;
            width: 100%;
            box-sizing: border-box;
        }

        .map-header {
            padding: 15px 20px;
            border-bottom: 1px solid var(--morandi-green-2);
            background: var(--morandi-green-1);
        }

        .map-header h2 {
            margin: 0;
            font-size: 18px;
            color: var(--morandi-text);
        }

        #map-container {
            flex: 1;
            position: relative;
            min-height: 500px;
            background-color: #d8eded; /* 地图海洋背景色 */
        }
        
        .fairness-chart-panel {
            width: 100%;
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--morandi-card);
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 15px;
            min-height: 0;
            box-sizing: border-box;
            position: relative;
        }
        
        .fairness-chart-panel h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: var(--morandi-text);
            border-bottom: 2px solid var(--morandi-green-3);
            padding-bottom: 8px;
            flex-shrink: 0;
        }
        
        .fairness-chart-panel .chart-container {
            flex: 1;
            min-height: 0;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Dashboard2风格的地图样式 */
        #map .bg-rect {
            fill: #d8eded; /* 海洋背景色 */
        }

        #map .planning-area-path {
            /* fill 由 JavaScript 动态设置，不在这里设置 */
            stroke: #e0e0e0; /* 浅灰色边框 */
            stroke-width: 1.5px;
            vector-effect: non-scaling-stroke;
        }

        #map .park-marker {
            fill: #01b074; /* 公园点颜色 */
            stroke: #fff; /* 白色边框 */
            stroke-width: 2px;
            paint-order: stroke;
            vector-effect: non-scaling-stroke;
        }

        #map .park-marker.existing-park {
            r: 5; /* 公园点半径 */
        }

        #map .park-marker.temp {
            fill: #fbd031; /* 临时公园使用高亮黄色 */
            stroke: #2a3940; /* 深色边框 */
            stroke-width: 4px;
        }

        #controls {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--morandi-card);
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #controls button {
            padding: 8px 16px;
            border: 1px solid var(--morandi-green-4);
            background: var(--morandi-green-2);
            color: var(--morandi-text);
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        #controls button:hover {
            background: var(--morandi-green-4);
            color: white;
        }

        #controls button.active {
            background: var(--morandi-green-6);
            color: white;
            border-color: var(--morandi-green-7);
        }

        .evaluation-panel {
            flex: 0 0 30%;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            min-height: 0;
        }

        .eval-module {
            background: var(--morandi-card);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            min-height: 0;
            position: relative;
        }
        
        .eval-module:has(.chart-container) {
            padding: 10px;
        }

        .eval-module h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: var(--morandi-text);
            border-bottom: 2px solid var(--morandi-green-3);
            padding-bottom: 8px;
            flex-shrink: 0;
        }

        .kpi-display {
            text-align: center;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .kpi-value {
            font-size: 48px;
            font-weight: bold;
            color: var(--morandi-green-6);
            margin: 10px 0;
            position: relative;
            z-index: 2;
        }

        .kpi-label {
            font-size: 14px;
            color: var(--morandi-text-light);
            margin-top: 5px;
        }

        .chart-container {
            width: 100%;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .chart-container svg {
            flex: 1;
            min-height: 0;
            width: 100%;
            height: 100%;
            display: block;
        }

        .loading-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--morandi-text-light);
            font-size: 14px;
            z-index: 10;
            pointer-events: none;
        }

        /* 对于KPI模块，加载指示器显示在KPI值上方 */
        #coverage-module .loading-indicator {
            top: 60%;
            transform: translate(-50%, 0);
        }

        .loading-indicator.hidden {
            display: none;
        }

        .loading-spinner-small {
            border: 3px solid var(--morandi-green-2);
            border-top: 3px solid var(--morandi-green-6);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        .chart-container,
        #map-container {
            position: relative;
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            font-size: 18px;
            color: var(--morandi-text);
        }

        .loading-spinner {
            border: 4px solid var(--morandi-green-2);
            border-top: 4px solid var(--morandi-green-6);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-overlay.hidden {
            display: none;
        }

        .tooltip {
            position: absolute;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.5;
            z-index: 2000;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .tooltip.visible {
            opacity: 1;
        }

        .park-marker {
            fill: var(--morandi-green-6);
            stroke: white;
            stroke-width: 2;
            cursor: pointer;
        }

        .park-marker:hover {
            fill: var(--morandi-green-7);
        }

        .park-marker.temp {
            fill: var(--morandi-green-4);
            stroke: var(--morandi-green-6);
            stroke-width: 3;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .input-dialog {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--morandi-card);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            z-index: 3000;
            display: none;
        }

        .input-dialog.visible {
            display: block;
        }

        .input-dialog h4 {
            margin: 0 0 15px 0;
            color: var(--morandi-text);
        }

        .input-dialog input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--morandi-green-3);
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .input-dialog .button-group {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .input-dialog button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .input-dialog button.confirm {
            background: var(--morandi-green-6);
            color: white;
        }

        .input-dialog button.cancel {
            background: var(--morandi-green-2);
            color: var(--morandi-text);
        }
    </style>
</head>

<body>
    <div class="header-container">
        <h1>Future: Policy Simulation</h1>
        <nav>
            <a href="dashboard1.html">Dashboard 1</a>
            <a href="dashboard2.html">Dashboard 2</a>
            <a href="dashboard3.html">Dashboard 3</a>
            <a href="dashboard4.html">Dashboard 4</a>
            <a href="dashboard5.html" class="active">Dashboard 5</a>
        </nav>
    </div>

    <div class="main-container">
        <div class="left-panel">
            <div class="map-panel">
                <div class="map-header">
                    <h2>Green Space Deficit Hotspot Map</h2>
                </div>
                <div id="map-container">
                    <svg id="map"></svg>
                    <div id="controls">
                        <button id="add-park-btn">Add New Park</button>
                        <button id="reset-btn">Reset Simulation</button>
                    </div>
                </div>
            </div>
            
            <div class="fairness-chart-panel">
                <h3>Per Capita Green Space Equity</h3>
                <div class="chart-container" id="fairness-chart"></div>
            </div>
        </div>

        <div class="evaluation-panel">
            <div class="eval-module" id="coverage-module">
                <h3>SDG 11.7 Coverage</h3>
                <div class="kpi-display">
                    <div class="kpi-value" id="coverage-kpi">0%</div>
                    <div class="kpi-label">Residential units within 400m</div>
                </div>
            </div>

            <div class="eval-module" style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
                <h3>Distance Distribution</h3>
                <div class="chart-container" id="distance-chart"></div>
            </div>
        </div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <div class="loading-overlay hidden" id="loading-overlay">
        <div class="loading-spinner"></div>
        <div id="loading-text">Loading data...</div>
    </div>

    <div class="input-dialog" id="park-input-dialog">
        <h4>Add New Park</h4>
        <input type="number" id="park-area-input" placeholder="Enter park area (square meters)" min="0" step="100">
        <div class="button-group">
            <button class="cancel" id="cancel-park-btn">Cancel</button>
            <button class="confirm" id="confirm-park-btn">Confirm</button>
        </div>
    </div>

    <script>
        // 全局状态
        let geoData = null;
        let metricsData = null;
        let residentialData = null;
        let parksData = null;
        let populationData = null;
        let paDeficitData = null;
        let tempParks = [];
        let isAddingPark = false;
        let pendingParkLocation = null;

        // D3 工具
        const tooltip = d3.select("#tooltip");
        let projection = null;
        let path = null;
        let mapSvg = null;

        // 提取规划区域名称
        function extractPAName(feature) {
            if (feature.properties.PLN_AREA_N) {
                return feature.properties.PLN_AREA_N.trim();
            }
            if (feature.properties.Description) {
                const match = feature.properties.Description.match(/<th>PLN_AREA_N<\/th>\s*<td>([^<]+)<\/td>/i);
                if (match && match[1]) {
                    return match[1].trim();
                }
            }
            return null;
        }

        // 标准化函数
        function normalize(value, min, max) {
            if (max === min) return 0;
            return (value - min) / (max - min);
        }

        // 更新加载文本
        function updateLoadingText(text) {
            const loadingText = document.getElementById("loading-text");
            if (loadingText) {
                loadingText.textContent = text;
            }
        }

        // 显示/隐藏加载指示器
        function showLoading() {
            const overlay = document.getElementById("loading-overlay");
            if (overlay) {
                overlay.classList.remove("hidden");
            }
        }

        function hideLoading() {
            const overlay = document.getElementById("loading-overlay");
            if (overlay) {
                overlay.classList.add("hidden");
            }
        }

        // 在各个区域显示加载提示
        function showLoadingInArea(containerId, message) {
            const container = document.getElementById(containerId);
            if (!container) {
                console.warn(`Container ${containerId} not found for loading indicator`);
                return null;
            }
            
            // 检查是否已有加载提示
            let indicator = container.querySelector('.loading-indicator');
            if (!indicator) {
                indicator = document.createElement('div');
                indicator.className = 'loading-indicator';
                indicator.innerHTML = `
                    <div class="loading-spinner-small"></div>
                    <div class="loading-text">${message}</div>
                `;
                // 确保容器有相对定位
                if (getComputedStyle(container).position === 'static') {
                    container.style.position = 'relative';
                }
                container.appendChild(indicator);
                console.log(`Loading indicator added to ${containerId}`);
            } else {
                const textEl = indicator.querySelector('.loading-text');
                if (textEl) textEl.textContent = message;
                indicator.classList.remove('hidden');
                console.log(`Loading indicator shown for ${containerId}`);
            }
            return indicator;
        }

        function hideLoadingInArea(containerId) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const indicator = container.querySelector('.loading-indicator');
            if (indicator) {
                indicator.classList.add('hidden');
            }
        }

        // 加载数据（异步）
        async function loadData() {
            try {
                showLoadingInArea("map-container", "Loading geographic data...");
                const rawGeo = await d3.json("src/sg_pa.geojson");
                
                showLoadingInArea("map-container", "Loading metrics data...");
                const metrics = await d3.csv("src/pa_metrics.csv");
                
                showLoadingInArea("map-container", "Loading residential data...");
                const residential = await d3.csv("src/residential_distances.csv");
                
                showLoadingInArea("map-container", "Loading parks data...");
                const parks = await d3.json("src/Parks.geojson");
                
                showLoadingInArea("map-container", "Loading population data...");
                const population = await d3.csv("src/population_by_pa.csv");

                // Geometry correction using turf.rewind
                showLoadingInArea("map-container", "Processing geographic data...");
                geoData = turf.rewind(rawGeo, { reverse: true, mutate: true });
                
                // 分配数据
                metricsData = metrics;
                residentialData = residential;
                parksData = parks;
                populationData = population;

                console.log("Data loading complete", {
                    geoFeatures: geoData.features.length,
                    metrics: metricsData.length,
                    residential: residentialData.length,
                    parks: parksData?.features?.length || 0
                });
                return true;
            } catch (error) {
                console.error("Data loading failed:", error);
                updateLoadingText(`Error: ${error.message}`);
                return false;
            }
        }

        // 计算短缺指数（异步版本，使用批量处理）
        async function calculateDeficitScores() {
            showLoadingInArea("map-container", "Calculating deficit scores...");
            
            // 使用 requestIdleCallback 或 setTimeout 来分批处理，避免阻塞
            await new Promise(resolve => {
                if (window.requestIdleCallback) {
                    requestIdleCallback(() => resolve(), { timeout: 1000 });
                } else {
                    setTimeout(() => resolve(), 0);
                }
            });
            // 处理规划区域名称映射
            const paNameMap = new Map();
            geoData.features.forEach(f => {
                const name = extractPAName(f);
                if (name) {
                    paNameMap.set(name.toUpperCase().trim(), f);
                }
            });

            // 处理metrics数据
            const metricsMap = new Map();
            metricsData.forEach(d => {
                const key = d.pa.toUpperCase().trim();
                metricsMap.set(key, {
                    pa: d.pa,
                    population: +d.population,
                    green_area_km2: +d.green_area_km2,
                    green_per_capita_m2: +d.green_per_capita_m2
                });
            });

            // 聚合residential数据，计算每个PA的平均距离
            // 首先建立PA名称到feature的映射（用于地理匹配）
            const paFeatureMap = new Map();
            geoData.features.forEach(f => {
                const name = extractPAName(f);
                if (name) {
                    const key = name.toUpperCase().trim();
                    paFeatureMap.set(key, f);
                }
            });

            const paDistances = new Map();
            let unknownCount = 0;
            let validCount = 0;
            let geoMatchedCount = 0;
            
            residentialData.forEach(d => {
                let pa = d.planning_area && d.planning_area !== "Unknown" 
                    ? d.planning_area.toUpperCase().trim() 
                    : null;
                
                // 如果planning_area是Unknown，尝试通过地理坐标匹配
                if (!pa || !paFeatureMap.has(pa)) {
                    const lon = +d.centroid_lon;
                    const lat = +d.centroid_lat;
                    if (!isNaN(lon) && !isNaN(lat)) {
                        const point = turf.point([lon, lat]);
                        // 找到包含该点的规划区域
                        for (const [key, feature] of paFeatureMap.entries()) {
                            if (feature.geometry.type === "Polygon") {
                                try {
                                    const polygon = turf.polygon(feature.geometry.coordinates);
                                    if (turf.booleanPointInPolygon(point, polygon)) {
                                        pa = key;
                                        geoMatchedCount++;
                                        break;
                                    }
                                } catch (e) {
                                    // 忽略几何错误
                                }
                            }
                        }
                    }
                }
                
                if (pa && paFeatureMap.has(pa)) {
                    if (!paDistances.has(pa)) {
                        paDistances.set(pa, []);
                    }
                    const dist = +d.distance_m;
                    if (!isNaN(dist) && dist > 0) {
                        paDistances.get(pa).push(dist);
                        validCount++;
                    }
                } else {
                    unknownCount++;
                }
            });

            console.log("Residential data statistics:", {
                total: residentialData.length,
                valid: validCount,
                unknown: unknownCount,
                geoMatched: geoMatchedCount,
                uniquePAs: paDistances.size
            });

            // 计算每个PA的平均距离
            const paAvgDistances = new Map();
            paDistances.forEach((distances, pa) => {
                if (distances.length > 0) {
                    const avg = d3.mean(distances);
                    if (!isNaN(avg) && avg > 0) {
                        paAvgDistances.set(pa, avg);
                    }
                }
            });

            console.log("PA average distance statistics:", {
                totalPAs: paAvgDistances.size,
                samplePAs: Array.from(paAvgDistances.entries()).slice(0, 5)
            });

            // 收集所有有效值用于标准化
            const perCapitaValues = [];
            const avgDistanceValues = [];
            
            // 只收集同时有metrics和avgDistance的PA的值
            metricsMap.forEach((metrics, key) => {
                const avgDist = paAvgDistances.get(key);
                if (avgDist !== undefined && !isNaN(avgDist) && avgDist > 0) {
                    const perCap = metrics.green_per_capita_m2;
                    if (!isNaN(perCap) && perCap >= 0) {
                        perCapitaValues.push(perCap);
                        avgDistanceValues.push(avgDist);
                    }
                }
            });

            console.log("Data matching statistics:", {
                metricsCount: metricsMap.size,
                avgDistanceCount: paAvgDistances.size,
                matchedCount: perCapitaValues.length,
                metricsKeys: Array.from(metricsMap.keys()).slice(0, 10),
                distanceKeys: Array.from(paAvgDistances.keys()).slice(0, 10)
            });

            // 如果没有匹配的数据，使用所有metrics数据来计算范围
            let minPerCapita, maxPerCapita, minAvgDistance, maxAvgDistance;
            
            if (perCapitaValues.length === 0 || avgDistanceValues.length === 0) {
                console.warn("No matched data, using all available data to calculate range");
                
                // 使用所有metrics数据
                const allPerCapita = Array.from(metricsMap.values())
                    .map(d => d.green_per_capita_m2)
                    .filter(v => !isNaN(v) && v >= 0);
                minPerCapita = allPerCapita.length > 0 ? d3.min(allPerCapita) : 0;
                maxPerCapita = allPerCapita.length > 0 ? d3.max(allPerCapita) : 1;
                
                // 使用所有avgDistance数据
                const allAvgDistances = Array.from(paAvgDistances.values())
                    .filter(v => !isNaN(v) && v > 0);
                minAvgDistance = allAvgDistances.length > 0 ? d3.min(allAvgDistances) : 0;
                maxAvgDistance = allAvgDistances.length > 0 ? d3.max(allAvgDistances) : 1000;
            } else {
                minPerCapita = d3.min(perCapitaValues);
                maxPerCapita = d3.max(perCapitaValues);
                minAvgDistance = d3.min(avgDistanceValues);
                maxAvgDistance = d3.max(avgDistanceValues);
            }

            console.log("Normalization range:", {
                perCapita: { min: minPerCapita, max: maxPerCapita },
                avgDistance: { min: minAvgDistance, max: maxAvgDistance }
            });

            // 计算短缺指数 - 为所有规划区域创建数据
            paDeficitData = [];
            let matchedCount = 0;
            
            geoData.features.forEach(f => {
                const name = extractPAName(f);
                if (!name) {
                    paDeficitData.push({
                        feature: f,
                        pa: "Unknown",
                        deficitScore: null,
                        greenPerCapita: 0,
                        avgDistance: 0,
                        population: 0,
                        greenArea: 0
                    });
                    return;
                }

                const key = name.toUpperCase().trim();
                const metrics = metricsMap.get(key);
                const avgDistance = paAvgDistances.get(key);

                // 只有当两个值都存在时才计算短缺指数
                if (metrics && avgDistance !== undefined && !isNaN(avgDistance) && avgDistance > 0) {
                    const normPerCapita = normalize(metrics.green_per_capita_m2, minPerCapita, maxPerCapita);
                    const normAvgDistance = normalize(avgDistance, minAvgDistance, maxAvgDistance);

                    // 确保标准化值在有效范围内
                    const clampedNormPerCapita = Math.max(0, Math.min(1, normPerCapita));
                    const clampedNormAvgDistance = Math.max(0, Math.min(1, normAvgDistance));

                    // Deficit_Score = (1 - norm_per_capita_space) + norm_avg_distance
                    const deficitScore = (1 - clampedNormPerCapita) + clampedNormAvgDistance;

                    paDeficitData.push({
                        feature: f,
                        pa: name,
                        deficitScore: deficitScore,
                        greenPerCapita: metrics.green_per_capita_m2,
                        avgDistance: avgDistance,
                        population: metrics.population,
                        greenArea: metrics.green_area_km2
                    });
                    matchedCount++;
                } else {
                    // 没有完整数据的区域
                    paDeficitData.push({
                        feature: f,
                        pa: name,
                        deficitScore: null,
                        greenPerCapita: metrics ? metrics.green_per_capita_m2 : 0,
                        avgDistance: avgDistance || 0,
                        population: metrics ? metrics.population : 0,
                        greenArea: metrics ? metrics.green_area_km2 : 0
                    });
                }
            });

            // 按短缺指数排序（排除null值）
            paDeficitData.sort((a, b) => {
                if (a.deficitScore === null) return 1;
                if (b.deficitScore === null) return -1;
                return b.deficitScore - a.deficitScore;
            });

            // 输出统计信息
            const validScores = paDeficitData.filter(d => d.deficitScore !== null).map(d => d.deficitScore);
            console.log("Deficit score calculation complete", {
                total: paDeficitData.length,
                matched: matchedCount,
                scoreRange: validScores.length > 0 ? {
                    min: d3.min(validScores).toFixed(3),
                    max: d3.max(validScores).toFixed(3),
                    mean: d3.mean(validScores).toFixed(3)
                } : "N/A"
            });
        }

            const minScore = d3.min(deficitScores);

            console.log("Deficit score statistics:", {

                max: maxScore.toFixed(3),
                range: (maxScore - minScore).toFixed(3)
            });
            
            // 创建低饱和度红色插值器（使用更明显的颜色范围）
            // 使用分位数映射，让颜色分布更均匀，突出差异
            // 使用5%和95%分位数来排除极端值，让中间值的差异更明显
            const p5 = d3.quantile(deficitScores, 0.05);
            const p95 = d3.quantile(deficitScores, 0.95);
            
            let colorDomain = [p5 || minScore, p95 || maxScore];
            console.log("Color mapping domain:", {

            // 使用低饱和度的黄色到红色色阶
            const yellowToRed = d3.interpolateRgb("#fff9e6", "#d4a5a5"); // 从低饱和度黄色到低饱和度红色
            const colorScale = d3.scaleSequential(yellowToRed)

            // 添加渐变停止点

            // 添加计算方式说明

            legendG.append("text")

            // 绘制现有公园（使用dashboard2样式）

            if (parksData && parksData.features) {

            // 添加地图点击事件（用于添加新公园）- 只绑定一次

        // 分批处理工具函数
        async function processBatch(items, batchSize, processor) {
            const results = [];
            for (let i = 0; i < items.length; i += batchSize) {
                const batch = items.slice(i, i + batchSize);
                const batchResults = await processor(batch, i);
                results.push(...batchResults);
                // 让出控制权，避免阻塞UI
                await new Promise(resolve => setTimeout(resolve, 0));
            }
            return results;
        }

        // 防抖函数
        let updateEvaluationTimeout = null;
        function debounceUpdateEvaluation() {
            if (updateEvaluationTimeout) {
                clearTimeout(updateEvaluationTimeout);
            }
            updateEvaluationTimeout = setTimeout(() => {
                updateEvaluation();
            }, 300);
        }

        // 更新评估面板（异步优化版本）
        async function updateEvaluation() {
            // 显示加载状态
            const kpiElement = document.getElementById("coverage-kpi");
            // showLoadingInArea("coverage-module", "Calculating coverage..."); // Removed: no loading text for coverage
            kpiElement.textContent = "Calculating..."; // Removed: only show loading indicator

            // 合并现有公园和临时公园
            const allParks = [...(parksData?.features || [])];
            tempParks.forEach(park => {
                allParks.push({
                    type: "Feature",
                    geometry: {
                        type: "Point",
                        coordinates: [park.lon, park.lat]
                    },
                    properties: {
                        NAME: "New Park",
                        area: park.area
                    }
                });
            });

            // 预处理公园坐标，避免重复创建turf.point
            const parkPoints = allParks
                .filter(park => park.geometry && park.geometry.coordinates && park.geometry.coordinates.length >= 2)
                .map(park => ({
                    point: turf.point(park.geometry.coordinates),
                    coords: park.geometry.coordinates
                }));

            // 分批计算400米覆盖率
            const BATCH_SIZE = 1000; // 每批处理1000个点
            let coveredCount = 0;
            let totalCount = 0;

            // 检查是否有公园数据
            if (parkPoints.length === 0) {
                console.warn("No park data available for coverage calculation");
                const coverage = 0;
                const currentValue = parseFloat(kpiElement.textContent.replace("%", "").replace("Calculating...", "0")) || 0;
                animateValue(kpiElement, currentValue, coverage, 1000);
                return;
            }

            console.log(`Calculating coverage with ${parkPoints.length} parks (${parksData?.features?.length || 0} existing + ${tempParks.length} new)`);

            // 计算仅由新公园覆盖的住宅点数量（用于调试）
            let newlyCoveredCount = 0;
            let coveredByExistingOnly = 0;
            let coveredByNewOnly = 0;
            let coveredByBoth = 0;
            let notCovered = 0;

            // 先计算仅由现有公园覆盖的情况（用于对比）
            const existingParkPoints = (parksData?.features || [])
                .filter(park => park.geometry && park.geometry.coordinates && park.geometry.coordinates.length >= 2)
                .map(park => turf.point(park.geometry.coordinates));

            await processBatch(residentialData, BATCH_SIZE, async (batch) => {
                batch.forEach(d => {
                    const resLon = +d.centroid_lon;
                    const resLat = +d.centroid_lat;
                    
                    // 只计算有效坐标的点
                    if (isNaN(resLon) || isNaN(resLat)) return;
                    
                    totalCount++; // 只在坐标有效时增加计数
                    const resPoint = turf.point([resLon, resLat]);

                    // 检查是否被现有公园覆盖
                    let coveredByExisting = false;
                    for (const parkPoint of existingParkPoints) {
                        const distance = turf.distance(resPoint, parkPoint, { units: "meters" });
                        if (distance <= 400) {
                            coveredByExisting = true;
                            break;
                        }
                    }

                    // 检查是否被新公园覆盖
                    let coveredByNew = false;
                    if (tempParks.length > 0) {
                        for (const park of tempParks) {
                            const parkPoint = turf.point([park.lon, park.lat]);
                            const distance = turf.distance(resPoint, parkPoint, { units: "meters" });
                            if (distance <= 400) {
                                coveredByNew = true;
                                break;
                            }
                        }
                    }

                    // 统计覆盖情况
                    if (coveredByExisting && coveredByNew) {
                        coveredByBoth++;
                    } else if (coveredByExisting) {
                        coveredByExistingOnly++;
                    } else if (coveredByNew) {
                        coveredByNewOnly++;
                        newlyCoveredCount++;
                    } else {
                        notCovered++;
                    }

                    // 使用提前退出优化：找到第一个在400米内的公园就停止
                    for (const { point: parkPoint } of parkPoints) {
                        const distance = turf.distance(resPoint, parkPoint, { units: "meters" });
                        if (distance <= 400) {
                            coveredCount++;
                            break; // 找到就退出，避免重复计算
                        }
                    }
                });
                return [];
            });

            const coverage = totalCount > 0 ? (coveredCount / totalCount) * 100 : 0;
            
            console.log(`Coverage calculation: ${coveredCount}/${totalCount} = ${coverage.toFixed(5)}%`);
            console.log(`Coverage breakdown:`, {
                total: totalCount,
                covered: coveredCount,
                notCovered: notCovered,
                coveredByExistingOnly: coveredByExistingOnly,
                coveredByNewOnly: coveredByNewOnly,
                coveredByBoth: coveredByBoth,
                newlyCoveredByNewParks: newlyCoveredCount,
                newParksCount: tempParks.length
            });
            
            // 如果添加了新公园，显示详细信息
            if (tempParks.length > 0) {
                console.log(`New parks added:`, tempParks.map(p => ({
                    location: [p.lon, p.lat],
                    area: p.area,
                    area_km2: (p.area / 1000000).toFixed(2)
                })));
                console.log(`Newly covered residential units: ${newlyCoveredCount} (${(newlyCoveredCount / totalCount * 100).toFixed(5)}%)`);
            }

            // 更新KPI（带动画）
            const currentValue = parseFloat(kpiElement.textContent.replace("%", "").replace("Calculating...", "0")) || 0;
            animateValue(kpiElement, currentValue, coverage, 1000);
            
            // 隐藏KPI加载提示（已移除，不再需要）
            // hideLoadingInArea("coverage-module");

            // 异步更新图表，避免阻塞
            updateFairnessChart().catch(e => console.error("Fairness chart update error:", e));
            updateDistanceChart().catch(e => console.error("Distance chart update error:", e));
        }

        // 数字动画
        function animateValue(element, start, end, duration) {
            const startTime = performance.now();
            const update = (currentTime) => {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const current = start + (end - start) * progress;
                element.textContent = current.toFixed(5) + "%";
                if (progress < 1) {
                    requestAnimationFrame(update);
                } else {
                    element.textContent = end.toFixed(5) + "%";
                }
            };
            requestAnimationFrame(update);
        }

        // 更新公平性图表（优化版本）
        async function updateFairnessChart() {
            showLoadingInArea("fairness-chart", "Calculating fairness data...");
            
            // 确保加载提示先显示
            await new Promise(resolve => requestAnimationFrame(resolve));
            
            // 计算每个PA的人均绿地（包括新公园）
            const paGreenArea = new Map();
            const paPopulation = new Map();

            // 初始化
            metricsData.forEach(d => {
                const key = d.pa.toUpperCase().trim();
                paGreenArea.set(key, +d.green_area_km2 * 1000000); // 转换为平方米
                paPopulation.set(key, +d.population);
            });

            // 预处理geoData，创建PA多边形和质心映射
            const paPolygons = new Map();
            const paCentroids = new Map();
            geoData.features.forEach(f => {
                const paName = extractPAName(f);
                if (!paName) return;
                const key = paName.toUpperCase().trim();
                if (f.geometry.type === "Polygon") {
                    paPolygons.set(key, turf.polygon(f.geometry.coordinates));
                }
                paCentroids.set(key, turf.centroid(f));
            });

            // 添加新公园的面积（优化：使用预处理的多边形）
            for (const park of tempParks) {
                const parkPoint = turf.point([park.lon, park.lat]);
                let nearestPA = null;
                let minDist = Infinity;

                // 先检查是否在多边形内
                for (const [key, polygon] of paPolygons.entries()) {
                    if (turf.booleanPointInPolygon(parkPoint, polygon)) {
                        if (paGreenArea.has(key)) {
                            paGreenArea.set(key, paGreenArea.get(key) + park.area);
                            nearestPA = key;
                            break;
                        }
                    }
                }

                // 如果不在任何PA内，找到最近的
                if (!nearestPA) {
                    for (const [key, centroid] of paCentroids.entries()) {
                        const dist = turf.distance(parkPoint, centroid);
                        if (dist < minDist) {
                            minDist = dist;
                            nearestPA = key;
                        }
                    }
                    if (nearestPA && paGreenArea.has(nearestPA)) {
                        paGreenArea.set(nearestPA, paGreenArea.get(nearestPA) + park.area);
                    }
                }

                // 让出控制权
                await new Promise(resolve => setTimeout(resolve, 0));
            }

            // 计算人均绿地
            const perCapitaData = [];
            paGreenArea.forEach((area, pa) => {
                const pop = paPopulation.get(pa) || 1;
                const perCapita = area / pop;
                perCapitaData.push({
                    pa: pa,
                    perCapita: perCapita,
                    area: area,
                    population: pop
                });
            });

            // 计算平均值
            const avgPerCapita = d3.mean(perCapitaData, d => d.perCapita);

            // 计算偏差
            perCapitaData.forEach(d => {
                d.deviation = d.perCapita - avgPerCapita;
            });

            // 排序并取前15和后15
            perCapitaData.sort((a, b) => b.deviation - a.deviation);
            const top15 = perCapitaData.slice(0, 15);
            const bottom15 = perCapitaData.slice(-15).reverse();
            const chartData = [...top15, ...bottom15];

            // 渲染图表
            const container = d3.select("#fairness-chart");
            // 移除SVG元素，但保留加载指示器
            container.selectAll("svg").remove();

            // 使用容器的实际尺寸，确保充分利用空间
            const containerNode = container.node();
            if (!containerNode) {
                console.warn("Fairness chart container not found");
                return;
            }
            
            // 等待DOM更新，确保容器尺寸正确
            await new Promise(resolve => setTimeout(resolve, 50));
            
            const containerWidth = containerNode.clientWidth || 300;
            const containerHeight = containerNode.clientHeight || 300;
            
            console.log("Fairness chart container size:", { containerWidth, containerHeight });
            
            const margin = { top: 20, right: 30, bottom: 60, left: 120 };
            const width = Math.max(300, containerWidth - margin.left - margin.right);
            const height = Math.max(300, containerHeight - margin.top - margin.bottom);

            const svg = container.append("svg")
            .attr("width", "100%")
                .attr("height", "100%")
                .attr("viewBox", `0 0 ${width + margin.left + margin.right} ${height + margin.top + margin.bottom}`)
                .attr("preserveAspectRatio", "xMidYMid meet");

            const g = svg.append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            const x = d3.scaleLinear()
                .domain(d3.extent(chartData, d => d.deviation))
                .nice()
                .range([0, width]);

            const y = d3.scaleBand()
                .domain(chartData.map(d => d.pa))
                .range([0, height])
                .padding(0.2);

            // 添加零线
            g.append("line")
                .attr("x1", x(0))
                .attr("x2", x(0))
                .attr("y1", 0)
                .attr("y2", height)
                .attr("stroke", "#666")
                .attr("stroke-width", 1)
                .attr("stroke-dasharray", "3,3");

            // 添加条形
            g.selectAll("rect")
                .data(chartData)
                .enter()
                .append("rect")
                .attr("x", d => d.deviation < 0 ? x(d.deviation) : x(0))
                .attr("y", d => y(d.pa))
                .attr("width", d => Math.abs(x(d.deviation) - x(0)))
                .attr("height", y.bandwidth())
                .attr("fill", d => d.deviation > 0 ? "#4CAF50" : "#FF9800")
                .attr("opacity", 0.7);

            // 添加Y轴
            g.append("g")
                .call(d3.axisLeft(y))
                .selectAll("text")
                .style("font-size", "10px");

            // 添加X轴
            g.append("g")
                .attr("transform", `translate(0,${height})`)
                .call(d3.axisBottom(x))
                .append("text")
                .attr("x", width / 2)
                .attr("y", 40)
                .attr("fill", "currentColor")
                .style("text-anchor", "middle")
                .style("font-size", "12px")
                .text("Deviation from Mean (m²/person)");
            
            // 隐藏公平性图表加载提示
            hideLoadingInArea("fairness-chart");
        }

        // 更新距离分布图表（异步优化版本）
        async function updateDistanceChart() {
            showLoadingInArea("distance-chart", "Calculating distance distribution...");
            
            // 合并所有公园
            const allParks = [...(parksData?.features || [])];
            tempParks.forEach(park => {
                allParks.push({
                    type: "Feature",
                    geometry: {
                        type: "Point",
                        coordinates: [park.lon, park.lat]
                    }
                });
            });

            // 预处理公园坐标
            const parkPoints = allParks
                .filter(park => park.geometry && park.geometry.coordinates && park.geometry.coordinates.length >= 2)
                .map(park => turf.point(park.geometry.coordinates));

            // 分批计算距离
            const distances = [];
            const BATCH_SIZE = 2000; // 每批处理2000个点

            const results = await processBatch(residentialData, BATCH_SIZE, async (batch) => {
                const batchDistances = [];
                batch.forEach(d => {
                    const resLon = +d.centroid_lon;
                    const resLat = +d.centroid_lat;
                    if (isNaN(resLon) || isNaN(resLat)) return;
                    
                    const resPoint = turf.point([resLon, resLat]);

                    let minDist = Infinity;
                    for (const parkPoint of parkPoints) {
                        const distance = turf.distance(resPoint, parkPoint, { units: "meters" });
                        if (distance < minDist) {
                            minDist = distance;
                        }
                    }

                    if (minDist < Infinity) {
                        batchDistances.push(minDist);
                    }
                });
                return batchDistances;
            });
            
            distances.push(...results.flat());

            if (distances.length === 0) {
                console.warn("No distance data");
                return;
            }

            // 创建直方图数据
            const bins = d3.bin().thresholds(20)(distances);
            const maxCount = d3.max(bins, d => d.length);

            // 渲染图表
            const container = d3.select("#distance-chart");
            container.selectAll("*").remove();

            // 使用容器的实际尺寸，确保充分利用空间
            const containerNode = container.node();
            const containerWidth = containerNode ? containerNode.clientWidth : 300;
            const containerHeight = containerNode ? containerNode.clientHeight : 300;
            
            const margin = { top: 20, right: 20, bottom: 50, left: 50 };
            const width = Math.max(300, containerWidth - margin.left - margin.right);
            const height = Math.max(300, containerHeight - margin.top - margin.bottom);

            const svg = container.append("svg")
                .attr("width", "100%")
                .attr("height", "100%")
                .attr("viewBox", `0 0 ${width + margin.left + margin.right} ${height + margin.top + margin.bottom}`)
                .attr("preserveAspectRatio", "xMidYMid meet");

            const g = svg.append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            const x = d3.scaleLinear()
                .domain([0, d3.max(bins, d => d.x1)])
                .range([0, width]);

            const y = d3.scaleLinear()
                .domain([0, maxCount])
                .range([height, 0]);

            // 添加条形
            g.selectAll("rect")
                .data(bins)
                .enter()
                .append("rect")
                .attr("x", d => x(d.x0))
                .attr("y", d => y(d.length))
                .attr("width", d => x(d.x1) - x(d.x0) - 1)
                .attr("height", d => height - y(d.length))
                .attr("fill", "#4CAF50")
                .attr("opacity", 0.7);

            // 添加400米参考线
            g.append("line")
                .attr("x1", x(400))
                .attr("x2", x(400))
                .attr("y1", 0)
                .attr("y2", height)
                .attr("stroke", "#FF5722")
                .attr("stroke-width", 2)
                .attr("stroke-dasharray", "5,5");

            g.append("text")
                .attr("x", x(400))
                .attr("y", -5)
                .attr("fill", "#FF5722")
                .style("text-anchor", "middle")
                .style("font-size", "11px")
                .text("400m");

            // 添加X轴
            g.append("g")
                .attr("transform", `translate(0,${height})`)
                .call(d3.axisBottom(x))
                .append("text")
                .attr("x", width / 2)
                .attr("y", 40)
                .attr("fill", "currentColor")
                .style("text-anchor", "middle")
                .style("font-size", "12px")
                .text("Distance (meters)");

            // 添加Y轴
            g.append("g")
                .call(d3.axisLeft(y))
                .append("text")
                .attr("transform", "rotate(-90)")
                .attr("y", -35)
                .attr("x", -height / 2)
                .attr("fill", "currentColor")
                .style("text-anchor", "middle")
                .style("font-size", "12px")
                .text("Number of Residential Units");
            
            // 隐藏距离分布图表加载提示
            hideLoadingInArea("distance-chart");
        }

        // 添加临时公园到地图
        function addTempParkToMap(park) {
            if (!projection) return;
            
            const coords = projection([park.lon, park.lat]);
            const radius = Math.max(5, Math.min(15, Math.sqrt(park.area / Math.PI) / 50));
            
            // 找到dotsG组（应该在map-content组内）
            let dotsG = mapSvg.select("g.map-content g.dots-g");
            if (dotsG.empty()) {
                const mainG = mapSvg.select("g.map-content");
                if (!mainG.empty()) {
                    dotsG = mainG.append("g").attr("class", "dots-g");
                } else {
                    // 如果map-content不存在，创建它
                    const contentG = mapSvg.append("g").attr("class", "map-content");
                    dotsG = contentG.append("g").attr("class", "dots-g");
                }
            }
            
            dotsG.append("circle")
                .attr("class", "park-marker temp")
                .attr("r", radius)
                .attr("transform", `translate(${coords[0]},${coords[1]})`)
                .datum(park)
                .on("mouseover", function(event, d) {
                    d3.select(this).attr("stroke-width", 6);
                    showTooltip(event, {
                        pa: "New Park",
                        type: "temp-park",
                        area: d.area
                    });
                })
                .on("mouseout", function(event, d) {
                    d3.select(this).attr("stroke-width", 4);
                    hideTooltip();
                });
        }

        // 事件处理
        document.getElementById("add-park-btn").addEventListener("click", function() {
            isAddingPark = !isAddingPark;
            this.classList.toggle("active");
            if (isAddingPark) {
                this.textContent = "Cancel";
                mapSvg.style("cursor", "crosshair");
            } else {
                this.textContent = "Add New Park";
                mapSvg.style("cursor", "default");
            }
        });

        document.getElementById("reset-btn").addEventListener("click", function() {
            tempParks = [];
            mapSvg.selectAll(".temp").remove();
            isAddingPark = false;
            document.getElementById("add-park-btn").classList.remove("active");
            document.getElementById("add-park-btn").textContent = "Add New Park";
            mapSvg.style("cursor", "default");
            debounceUpdateEvaluation(); // 使用防抖更新
        });

        document.getElementById("confirm-park-btn").addEventListener("click", function() {
            const area = parseFloat(document.getElementById("park-area-input").value);
            if (area > 0 && pendingParkLocation) {
                const park = {
                    lon: pendingParkLocation[0],
                    lat: pendingParkLocation[1],
                    area: area
                };
                tempParks.push(park);
                addTempParkToMap(park);
                debounceUpdateEvaluation(); // 使用防抖更新

                document.getElementById("park-input-dialog").classList.remove("visible");
                document.getElementById("park-area-input").value = "";
                pendingParkLocation = null;
            }
        });

        document.getElementById("cancel-park-btn").addEventListener("click", function() {
            document.getElementById("park-input-dialog").classList.remove("visible");
            document.getElementById("park-area-input").value = "";
            pendingParkLocation = null;
        });

        // 窗口大小调整
        let resizeTimeout;
        window.addEventListener("resize", function() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(function() {
                if (geoData && paDeficitData && projection) {
                    const container = d3.select("#map-container");
                    const containerNode = container.node();
                    const width = containerNode.clientWidth;
                    const height = containerNode.clientHeight;

                    mapSvg.attr("width", width).attr("height", height);

                    // 使用fitExtent（与dashboard2一致）
                    const margin = { top: 4, right: 4, bottom: 4, left: 4 };
                    projection = d3.geoMercator()
                        .fitExtent(
                            [[margin.left, margin.top], [width - margin.right, height - margin.bottom]],
                            geoData
                        );

                    path = d3.geoPath().projection(projection);

                    // 重新绘制所有元素（保留控制按钮）
                    mapSvg.selectAll("*").remove();
                    
                    // 重新添加背景
                    mapSvg.append("rect")
                        .attr("class", "bg-rect")
                        .attr("width", width)
                        .attr("height", height);
                    
                    const g = mapSvg.append("g").attr("class", "map-content");
                    
                    // 创建zoom行为
                    const zoom = d3.zoom()
                        .scaleExtent([0.5, 8])
                        .on("zoom", function(event) {
                            g.attr("transform", event.transform);
                        });
                    
                    mapSvg.call(zoom);
                    
                    // 重新绘制地图
                    const deficitScores = paDeficitData
                        .map(d => d.deficitScore)
                        .filter(v => v !== null && v !== undefined && !isNaN(v));
                    
                    if (deficitScores.length === 0) {
                        console.error("No valid deficit score data");
                        return;
                    }
                    
                    const minScore = d3.min(deficitScores);
                    const maxScore = d3.max(deficitScores);
                    // 使用低饱和度的黄色到红色色阶
                    const yellowToRed = d3.interpolateRgb("#fff9e6", "#d4a5a5"); // 从低饱和度黄色到低饱和度红色
                    const colorScale = d3.scaleSequential(yellowToRed)
                        .domain([minScore, maxScore])
                        .clamp(true);
                    
                    // 绘制规划区域
                    const planningAreaG = g.append("g").attr("class", "planning-areas-g");
                    const dotsG = g.append("g").attr("class", "dots-g");
                    planningAreaG.selectAll("path.planning-area-path")
                        .data(paDeficitData)
                        .enter()
                        .append("path")
                        .attr("class", "planning-area-path")
                        .attr("d", d => path(d.feature))
                        .style("fill", d => {
                            // 使用style而不是attr来设置fill，确保优先级
                            if (d.deficitScore === null || d.deficitScore === undefined || isNaN(d.deficitScore)) {
                                return "#f0f0f0"; // 灰色表示没有数据
                            }
                            return colorScale(d.deficitScore);
                        })
                        .on("mouseover", function(event, d) {
                            d3.select(this).attr("stroke-width", 3).attr("stroke", "#2a3940");
                            showTooltip(event, d);
                        })
                        .on("mouseout", function(event, d) {
                            d3.select(this).attr("stroke-width", 1.5).attr("stroke", "#e0e0e0");
                            hideTooltip();
                        });

                    // 绘制现有公园
                    // dotsG已经在上面创建了
                    if (parksData && parksData.features) {
                        dotsG.selectAll("circle.existing-park")
                            .data(parksData.features)
                            .enter()
                            .append("circle")
                            .attr("class", "park-marker existing-park")
                            .attr("r", 5)
                            .attr("transform", d => {
                                const coords = projection(d.geometry.coordinates);
                                return `translate(${coords[0]},${coords[1]})`;
                            })
                            .on("mouseover", function(event, d) {
                                d3.select(this).attr("stroke-width", 4).attr("stroke", "#2a3940");
                                showTooltip(event, {
                                    pa: d.properties.NAME || "Park",
                                    type: "park"
                                });
                            })
                            .on("mouseout", function(event, d) {
                                d3.select(this).attr("stroke-width", 2).attr("stroke", "#fff");
                                hideTooltip();
                            });
                    }
                    
                    // 重新绘制临时公园
                    tempParks.forEach(park => addTempParkToMap(park));
                    
                    // 重新绘制图例
                    const legendWidth = 200;
                    const legendHeight = 140;
                    const legendX = width - legendWidth - 20;
                    const legendY = height - legendHeight - 20;

                    // 移除旧的图例（如果存在）
                    mapSvg.selectAll(".deficit-legend").remove();

                    const legendG = mapSvg.append("g")
                        .attr("class", "deficit-legend")
                        .attr("transform", `translate(${legendX}, ${legendY})`);

                    // 图例背景
                    legendG.append("rect")
                        .attr("width", legendWidth)
                        .attr("height", legendHeight)
                        .attr("fill", "white")
                        .attr("fill-opacity", 0.9)
                        .attr("stroke", "#ccc")
                        .attr("stroke-width", 1)
                        .attr("rx", 4);

                    // 图例标题
                    legendG.append("text")
                        .attr("x", legendWidth / 2)
                        .attr("y", 15)
                        .attr("text-anchor", "middle")
                        .attr("font-size", "12px")
                        .attr("font-weight", "bold")
                        .attr("fill", "#333")
                        .text("Deficit Score");

                    // 创建渐变定义（如果不存在）
                    let defs = mapSvg.select("defs");
                    if (defs.empty()) {
                        defs = mapSvg.append("defs");
                    }
                    
                    // 移除旧的渐变（如果存在）
                    defs.selectAll("#deficit-gradient").remove();
                    
                    const gradient = defs.append("linearGradient")
                        .attr("id", "deficit-gradient")
                        .attr("x1", "0%")
                        .attr("x2", "100%")
                        .attr("y1", "0%")
                        .attr("y2", "0%");

                    // 添加渐变停止点
                    const numStops = 10;
                    for (let i = 0; i <= numStops; i++) {
                        const t = i / numStops;
                        const score = minScore + (maxScore - minScore) * t;
                        const color = colorScale(score);
                        gradient.append("stop")
                            .attr("offset", `${t * 100}%`)
                            .attr("stop-color", color);
                    }

                    // 绘制渐变条
                    const gradientBarWidth = legendWidth - 40;
                    const gradientBarHeight = 20;
                    const gradientBarX = 20;
                    const gradientBarY = 30;

                    legendG.append("rect")
                        .attr("x", gradientBarX)
                        .attr("y", gradientBarY)
                        .attr("width", gradientBarWidth)
                        .attr("height", gradientBarHeight)
                        .attr("fill", "url(#deficit-gradient)")
                        .attr("stroke", "#999")
                        .attr("stroke-width", 0.5);

                    // 添加最小值和最大值标签
                    legendG.append("text")
                        .attr("x", gradientBarX)
                        .attr("y", gradientBarY + gradientBarHeight + 15)
                        .attr("font-size", "10px")
                        .attr("fill", "#666")
                        .text(minScore.toFixed(3));

                    legendG.append("text")
                        .attr("x", gradientBarX + gradientBarWidth)
                        .attr("y", gradientBarY + gradientBarHeight + 15)
                        .attr("text-anchor", "end")
                        .attr("font-size", "10px")
                        .attr("fill", "#666")
                        .text(maxScore.toFixed(3));

                    // 添加计算方式说明
                    legendG.append("text")
                        .attr("x", legendWidth / 2)
                        .attr("y", gradientBarY + gradientBarHeight + 35)
                        .attr("text-anchor", "middle")
                        .attr("font-size", "9px")
                        .attr("fill", "#666")
                        .attr("font-style", "italic")
                        .text("Calculation:");

                    legendG.append("text")
                        .attr("x", legendWidth / 2)
                        .attr("y", gradientBarY + gradientBarHeight + 48)
                        .attr("text-anchor", "middle")
                        .attr("font-size", "9px")
                        .attr("fill", "#666")
                        .text("(1 - NormPerCapita) + NormAvgDistance");

                    legendG.append("text")
                        .attr("x", legendWidth / 2)
                        .attr("y", gradientBarY + gradientBarHeight + 61)
                        .attr("text-anchor", "middle")
                        .attr("font-size", "8px")
                        .attr("fill", "#888")
                        .text("Higher = More Deficit");
                }
            }, 250);
        });

        // 初始化（完全异步，不阻塞页面）
        (async function() {
            try {
                // 不显示全屏加载覆盖层，让页面直接显示
                // showLoading(); // 注释掉，不显示全屏加载
                
                // 等待DOM完全加载
                if (document.readyState === 'loading') {
                    await new Promise(resolve => {
                        document.addEventListener('DOMContentLoaded', resolve);
                    });
                }
                
                // 使用 requestIdleCallback 或 setTimeout 延迟加载，让页面先渲染
                await new Promise(resolve => {
                    if (window.requestIdleCallback) {
                        requestIdleCallback(resolve, { timeout: 100 });
                    } else {
                        setTimeout(resolve, 100);
                    }
                });
                
                // 加载数据（后台异步）
                console.log("Loading data files...");
                const loaded = await loadData();
                if (!loaded) {
                    console.error("Failed to load data files");
                    alert("Data loading failed. Please check if the data files exist.");
                    return;
                }

                // 计算短缺指数（异步，后台进行）
                console.log("Calculating deficit scores...");
                await calculateDeficitScores();
                
                console.log("Preparing to initialize map...", {
                    geoData: !!geoData,
                    paDeficitData: paDeficitData?.length,
                    parksData: !!parksData
                });

                // 初始化地图（使用 requestAnimationFrame 确保不阻塞）
                await new Promise(resolve => {
                    requestAnimationFrame(() => {
                        try {
                            initMap();
                            console.log("Map initialization complete");
                            resolve();
                        } catch (e) {
                            console.error("Map initialization error:", e);
                            alert("Map initialization failed: " + e.message);
                            resolve();
                        }
                    });
                });

                // 更新评估面板（异步，后台进行）
                await new Promise(resolve => {
                    setTimeout(async () => {
                        try {
                            await updateEvaluation();
                            console.log("Evaluation panel updated");
                        } catch (e) {
                            console.error("Evaluation update error:", e);
                        }
                        resolve();
                    }, 100);
                });

                console.log("Initialization complete");
                
            } catch (e) {
                console.error("Initialization error:", e);
                alert("Initialization failed: " + e.message);
            }
        })();
